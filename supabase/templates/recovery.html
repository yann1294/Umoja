<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your Umoja password</h1>
    <p>Use this single-use link to choose a new password.</p>
    <p>
      <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
        >Choose a new password</a
      >
    </p>
    <hr />
    <h1 lang="fr">Réinitialiser votre mot de passe Umoja</h1>
    <p lang="fr">Utilisez ce lien à usage unique pour choisir un nouveau mot de passe.</p>
    <p lang="fr">
      <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
        >Choisir un nouveau mot de passe</a
      >
    </p>
  </body>
</html>
